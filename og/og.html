<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=block">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #00a79d; }
  body { position: relative; font-family: "Bricolage Grotesque", sans-serif; color: #fff; }
  .super { position: absolute; right: -60px; bottom: -40px; width: 760px; }
  .super path { fill: #13b3a8; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px); background-size: 60px 60px; mask-image: linear-gradient(90deg, #000 0%, transparent 70%); }
  .brand { position: absolute; left: 64px; top: 56px; display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 46px; height: 38px; }
  .brand b { font-family: "Archivo"; font-weight: 800; font-variation-settings: "wdth" 125; font-size: 26px; letter-spacing: -.01em; line-height: 1; }
  .brand small { display: block; font-size: 12px; letter-spacing: .16em; font-weight: 600; margin-top: 5px; opacity: .85; }
  h1 { position: absolute; left: 64px; top: 150px; font-family: "Archivo"; font-weight: 800; font-variation-settings: "wdth" 125; font-size: 76px; line-height: .98; letter-spacing: -.025em; width: 700px; }
  h1 em { font-style: italic; font-weight: 700; font-variation-settings: "wdth" 112; color: #1c2326; }
  .portrait { position: absolute; right: 18px; bottom: 112px; width: 430px; }
  .card { position: absolute; right: 340px; bottom: 150px; background: #f3f1ec; color: #1c2326; padding: 14px 18px 14px 16px; border-left: 4px solid #f5b800; box-shadow: 0 18px 36px -16px rgba(0,40,37,.55); }
  .card b { display: block; font-family: "Archivo"; font-weight: 800; font-variation-settings: "wdth" 112; font-size: 19px; }
  .card span { font-size: 14px; color: #33403d; }
  .strip { position: absolute; left: 0; right: 0; bottom: 0; height: 112px; background: #1c2326; display: flex; align-items: center; padding: 0 64px; gap: 0; }
  .stat { padding-right: 34px; margin-right: 34px; border-right: 1px solid rgba(243,241,236,.16); }
  .stat.last { border-right: 0; }
  .stat b { display: block; font-family: "Archivo"; font-weight: 800; font-variation-settings: "wdth" 62; font-size: 46px; line-height: 1; color: #fff; letter-spacing: -.01em; }
  .stat b i { font-style: normal; color: #f5b800; }
  .stat span { display: block; font-size: 14px; color: rgba(243,241,236,.7); margin-top: 6px; font-weight: 500; }
  .cta { margin-left: auto; display: flex; align-items: center; background: #f5b800; color: #1c2326; font-family: "Archivo"; font-weight: 700; font-size: 19px; height: 58px; padding-left: 22px; gap: 16px; }
  .cta svg { width: 58px; height: 58px; padding: 21px; background: #e0a800; color: #1c2326; }
</style>
</head>
<body>
  <div class="grid"></div>
  <svg class="super" viewBox="0 0 300 250"><path d="M0 250V125l100 50v75zM100 250V63l100 50v137zM200 250V0l100 50v200z"/></svg>
  <div class="brand">
    <svg viewBox="0 0 300 250"><path fill="#f5b800" d="M0 250V125l100 50v75zM100 250V63l100 50v137zM200 250V0l100 50v200z"/></svg>
    <div><b>ALBERT GIL</b><small>LEAN · WCM · EXCELÊNCIA OPERACIONAL</small></div>
  </div>
  <h1>Melhoria contínua, <em>um degrau por vez.</em></h1>
  <img class="portrait" src="../img/albert-gil.webp" alt="">
  <div class="card"><b>30 anos de chão de fábrica</b><span>Da linha da Fiat à direção industrial</span></div>
  <div class="strip">
    <div class="stat"><b>R$ 269<i> mi</i></b><span>em ganhos anuais medidos</span></div>
    <div class="stat"><b>31<i>×</i></b><span>retorno mediano</span></div>
    <div class="stat last"><b>244</b><span>empresas em 21 programas</span></div>
    <div class="cta">Veja os resultados<svg viewBox="0 0 16 16"><path d="M1 8h13M9 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></div>
  </div>
</body>
</html>
